name: Apply Persistence Foundation

on:
  push:
    branches: [feat/avans-os-ajustes-reunion-2026-11-03]
    paths:
      - scripts/apply-persistence-foundation.py
      - scripts/fix-os-store-hydration.py
      - .github/workflows/apply-persistence-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/avans-os-ajustes-reunion-2026-11-03
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Apply source patch
        run: |
          python scripts/apply-persistence-foundation.py
          python scripts/fix-os-store-hydration.py
          # The connected GitHub App cannot push workflow changes. Keep the
          # existing quality gate untouched and commit only product source.
          git checkout -- .github/workflows/quality-gate.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-persistence-foundation.py scripts/fix-os-store-hydration.py
          git add app lib supabase docs .env.example
          git diff --cached --stat
          git commit -m "feat(os): persist preview state and stage secure data layer"
          git push origin HEAD:feat/avans-os-ajustes-reunion-2026-11-03
