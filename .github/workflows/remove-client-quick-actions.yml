name: Remove Client Quick Actions

on:
  push:
    branches:
      - "feat/avans-os-ajustes-reunion-2026-11-03"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "feat/avans-os-ajustes-reunion-2026-11-03"
          persist-credentials: true

      - name: Remove meeting and Drive quick actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/v2/os/screens/client-workspace.tsx")
          text = path.read_text()
          text = text.replace(
              'import { AvansIcon, AvansModuleIcon } from "../brand";',
              'import { AvansModuleIcon } from "../brand";',
              1,
          )
          text = text.replace(
              '  const { notify, servicesOf } = useOsStore();',
              '  const { servicesOf } = useOsStore();',
              1,
          )

          start = '        <div className={s.actions}>\n'
          marker = '        <div className={m.managementBlock}>'
          if start not in text or marker not in text:
              raise SystemExit("Client quick actions block was not found")

          before, remainder = text.split(start, 1)
          _, after = remainder.split(marker, 1)
          path.write_text(before + marker + after)
          PY

      - name: Commit requested adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v2/os/screens/client-workspace.tsx
          git commit -m "fix(os): remove meeting and Drive actions from client header"
          git push origin HEAD:feat/avans-os-ajustes-reunion-2026-11-03
